<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Trade Breakdown · Terminal variations</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="dashboards.css?v=2" />
<link rel="stylesheet" href="terminal-v2.css?v=2" />
<link rel="stylesheet" href="shadcn-globals.css?v=1" />
<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          border: 'hsl(var(--border))',
          input: 'hsl(var(--input))',
          ring: 'hsl(var(--ring))',
          background: 'hsl(var(--background))',
          foreground: 'hsl(var(--foreground))',
          primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
          secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
          destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
          muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
          accent: { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
          popover: { DEFAULT: 'hsl(var(--popover))', foreground: 'hsl(var(--popover-foreground))' },
          card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' },
        },
        borderRadius: { lg: 'var(--radius)', md: 'calc(var(--radius) - 2px)', sm: 'calc(var(--radius) - 4px)' },
      }
    }
  }
</script>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="trades-data.jsx?v=2"></script>
<script type="text/babel" src="terminal-shared.jsx?v=2"></script>
<script type="text/babel" src="shadcn-ui.jsx?v=1"></script>
<script type="text/babel" src="terminal-01-command.jsx?v=2"></script>
<script type="text/babel" src="terminal-02-split.jsx?v=2"></script>
<script type="text/babel" src="terminal-03-tape.jsx?v=2"></script>
<script type="text/babel" src="terminal-04-density.jsx?v=2"></script>
<script type="text/babel" src="terminal-05-traders.jsx?v=3"></script>
<script type="text/babel" src="terminal-06-bots.jsx?v=3"></script>

<script type="text/babel">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "density": "compact",
    "grade": "A-F",
    "showQuality": true
  }/*EDITMODE-END*/;

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

    return (
      <>
        <DesignCanvas>
          <DCSection id="terminals" title="Trade Breakdown · Terminal variations"
            subtitle="Six dense, pro-trader layouts on one data model. Repo patterns built in: strategy color tokens, flag icons (AC·LO·TR·AD·SL·CF·MD·CH), broker↔system reconciliation, signal→fill latency, trader/bot attribution. Every trade opens the shared Trade Detail Panel. Click any label to focus fullscreen.">

            <DCArtboard id="command" label="01 · Command — full command-center" width={1680} height={1050}>
              <TerminalCommand density={t.density} gradeScale={t.grade} showQuality={t.showQuality} />
            </DCArtboard>

            <DCArtboard id="split" label="02 · Split — by-ticker drilldown" width={1680} height={1200}>
              <TerminalSplit density={t.density} gradeScale={t.grade} showQuality={t.showQuality} />
            </DCArtboard>

            <DCArtboard id="tape" label="03 · Tape — calendar-centric" width={1680} height={1200}>
              <TerminalTape density={t.density} gradeScale={t.grade} showQuality={t.showQuality} />
            </DCArtboard>

            <DCArtboard id="density" label="04 · Density — everything at once" width={1680} height={1200}>
              <TerminalDensity density={t.density} gradeScale={t.grade} showQuality={t.showQuality} />
            </DCArtboard>

            <DCArtboard id="traders" label="05 · Backtest Run — P&L by Trader × Strategy" width={1680} height={1100}>
              <TerminalTraders density={t.density} gradeScale={t.grade} showQuality={t.showQuality} />
            </DCArtboard>

            <DCArtboard id="bots" label="06 · Open Positions Timeline — diagnostic" width={1680} height={1100}>
              <TerminalBots density={t.density} gradeScale={t.grade} showQuality={t.showQuality} />
            </DCArtboard>
          </DCSection>

          <DCPostIt top={40} right={40} rotate={3} width={250}>
            Flag legend · AC auto-close · LO leg-off · TR trim · AD add · SL slippage · CF close-failed · MD market-data · CH chase. · 05 is a Backtest Run Performance tab; 06 diagnoses why positions are still open (past-plan vs. wheel-expiry vs. stock holds).
          </DCPostIt>
        </DesignCanvas>

        <TweaksPanel title="Tweaks">
          <TweakSection label="Grading" />
          <TweakRadio label="Scale" value={t.grade} options={['A-F', '0-100', 'emoji']} onChange={v => setTweak('grade', v)} />
          <TweakToggle label="Show quality score" value={t.showQuality} onChange={v => setTweak('showQuality', v)} />
          <TweakSection label="Table density" />
          <TweakRadio label="Density" value={t.density} options={['compact', 'comfy', 'spacious']} onChange={v => setTweak('density', v)} />
        </TweaksPanel>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
