# newsyslog config for trade-follower-3 launchd-captured logs.
# Install: sudo cp scripts/launchd/tradefollower.newsyslog.conf /etc/newsyslog.d/tradefollower.conf
# Rotation fires daily (via /System/Library/LaunchDaemons/com.apple.newsyslog.plist).
# Keeps 14 days of gzip-compressed archives. Rotates at 50 MB or daily, whichever comes first.
#
# Columns: logfile  [owner:group]  mode  count  size(KB)  when  flags
